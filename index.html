<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clofovoz Music — Plataforma SaaS & Audio</title>
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: #111827;
      --accent: #06b6d4;
      --accent-hover: #0891b2;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.6;
    }

    /* Navbar */
    header {
      border-bottom: 1px solid var(--border);
      background-color: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .nav-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.5px;
    }

    /* Hero */
    .hero {
      max-width: 900px;
      margin: 60px auto 40px auto;
      text-align: center;
      padding: 0 20px;
    }

    .hero h1 {
      font-size: 2.75rem;
      font-weight: 800;
      margin-bottom: 16px;
      line-height: 1.2;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1.15rem;
      margin-bottom: 30px;
    }

    /* Contenedor Auth / SaaS */
    .auth-card {
      max-width: 440px;
      margin: 0 auto 60px auto;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .auth-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .auth-tab-btn {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .auth-tab-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      background: #030712;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 8px;
    }

    .submit-btn:hover {
      background: var(--accent-hover);
    }

    #auth-status {
      margin-top: 14px;
      font-size: 0.85rem;
      text-align: center;
      min-height: 20px;
    }

    /* Panel de usuario activo */
    .user-info {
      text-align: center;
      padding: 10px 0;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      margin: 10px 0 20px 0;
    }

    .logout-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <div class="logo">CLOFOVOZ MUSIC</div>
      <div style="font-size: 0.85rem; color: var(--text-muted);">SaaS Cloud Platform</div>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>Plataforma Inteligente de Producción & Distribución Musical</h1>
      <p>Gestión de audio, masterización asistida por IA y herramientas colaborativas para creadores de sonido.</p>
    </section>

    <!-- Caja de Acceso / Panel SaaS -->
    <section class="auth-card">
      <div id="auth-forms">
        <div class="auth-tabs">
          <button id="tab-login" class="auth-tab-btn active" onclick="switchAuthTab('login')">Ingresar</button>
          <button id="tab-register" class="auth-tab-btn" onclick="switchAuthTab('register')">Crear Cuenta</button>
        </div>

        <!-- Formulario Iniciar Sesión -->
        <form id="form-login" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label>Correo electrónico</label>
            <input type="email" id="login-email" required placeholder="tu@email.com">
          </div>
          <div class="form-group">
            <label>Contraseña</label>
            <input type="password" id="login-password" required placeholder="••••••••">
          </div>
          <button type="submit" class="submit-btn">Entrar a mi estudio</button>
        </form>

        <!-- Formulario Registrarse -->
        <form id="form-register" onsubmit="handleRegister(event)" style="display: none;">
          <div class="form-group">
            <label>Nombre o Proyecto Musical</label>
            <input type="text" id="reg-nombre" required placeholder="Ej. Jaime Beats">
          </div>
          <div class="form-group">
            <label>Correo electrónico</label>
            <input type="email" id="reg-email" required placeholder="tu@email.com">
          </div>
          <div class="form-group">
            <label>Contraseña</label>
            <input type="password" id="reg-password" required minlength="6" placeholder="Mínimo 6 caracteres">
          </div>
          <div class="form-group">
            <label>Plan de Servicio</label>
            <select id="reg-plan">
              <option value="free">Free Creator (Funciones básicas)</option>
              <option value="creator">Creator Studio ($12/mes)</option>
              <option value="pro">Pro Producer ($29/mes)</option>
            </select>
          </div>
          <button type="submit" class="submit-btn" style="background: #10b981;">Registrarse</button>
        </form>

        <div id="auth-status"></div>
      </div>

      <!-- Panel de Control si ya inició sesión -->
      <div id="user-panel" style="display: none;">
        <div class="user-info">
          <h2>¡Bienvenido!</h2>
          <p id="user-display-name" style="font-size: 1.1rem; font-weight: 700; margin-top: 6px;"></p>
          <div id="user-display-plan" class="badge"></div>
          <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px;">Tu entorno de trabajo y base de datos en Render están sincronizados.</p>
          <button class="logout-btn" onclick="handleLogout()">Cerrar Sesión</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const SAAS_API = "https://clofovozmusic-ai.onrender.com";

    function switchAuthTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('form-login').style.display = isLogin ? 'block' : 'none';
      document.getElementById('form-register').style.display = isLogin ? 'none' : 'block';
      
      document.getElementById('tab-login').classList.toggle('active', isLogin);
      document.getElementById('tab-register').classList.toggle('active', !isLogin);
      
      const statusEl = document.getElementById('auth-status');
      statusEl.innerText = '';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const statusEl = document.getElementById('auth-status');
      statusEl.style.color = '#38bdf8';
      statusEl.innerText = 'Conectando con el servidor...';

      try {
        const res = await fetch(`${SAAS_API}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('login-email').value,
            password: document.getElementById('login-password').value
          })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Error al iniciar sesión');

        localStorage.setItem('clofovoz_token', data.access_token);
        localStorage.setItem('clofovoz_user', JSON.stringify(data.usuario));
        checkAuthSession();
      } catch (err) {
        statusEl.style.color = '#ef4444';
        statusEl.innerText = err.message;
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const statusEl = document.getElementById('auth-status');
      statusEl.style.color = '#38bdf8';
      statusEl.innerText = 'Creando cuenta en PostgreSQL...';

      try {
        const res = await fetch(`${SAAS_API}/api/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nombre: document.getElementById('reg-nombre').value,
            email: document.getElementById('reg-email').value,
            password: document.getElementById('reg-password').value,
            plan: document.getElementById('reg-plan').value
          })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Error al registrarse');

        localStorage.setItem('clofovoz_token', data.access_token);
        localStorage.setItem('clofovoz_user', JSON.stringify(data.usuario));
        checkAuthSession();
      } catch (err) {
        statusEl.style.color = '#ef4444';
        statusEl.innerText = err.message;
      }
    }

    function handleLogout() {
      localStorage.removeItem('clofovoz_token');
      localStorage.removeItem('clofovoz_user');
      checkAuthSession();
    }

    function checkAuthSession() {
      const token = localStorage.getItem('clofovoz_token');
      const user = JSON.parse(localStorage.getItem('clofovoz_user') || 'null');

      if (token && user) {
        document.getElementById('auth-forms').style.display = 'none';
        document.getElementById('user-panel').style.display = 'block';
        document.getElementById('user-display-name').innerText = user.nombre || user.email;
        document.getElementById('user-display-plan').innerText = 'PLAN ' + (user.plan || 'FREE').toUpperCase();
      } else {
        document.getElementById('auth-forms').style.display = 'block';
        document.getElementById('user-panel').style.display = 'none';
      }
    }

    // Comprobar sesión al entrar a la web
    checkAuthSession();
  </script>
</body>
</html>
